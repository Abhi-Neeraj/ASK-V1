# Render Blueprint for the ASK server (platform/api): the API and the processing worker in one free web service in
# Singapore. The database is NOT on Render: it is a free Neon PostgreSQL database (also Singapore), because Render's
# free database is deleted 30 days after it is created. Neon has no expiry; it pauses after 5 minutes without queries
# and wakes in about half a second.
#
# Free-tier limits (Render): the service has 512 MB and a tenth of a CPU; it sleeps after 15 minutes without requests
# (about a minute to wake) unless something calls /api/health every 10 minutes or less (see
# .github/workflows/keep-render-awake.yml, or a free pinger such as cron-job.org); there is no permanent disk, so
# uploaded audio lives only until the container restarts (the worker transcribes it within minutes of arrival).
#
# ASK_ENV stays "development" exactly as on Railway (log-only email); see docs/HANDOFF_2026-11-16.md section 9
# before switching to production. Every value marked `sync: false` is entered in the Render dashboard or sent with
# the Render API by the owner (scripts under platform/deploy): nothing secret is written in this file.

services:
  - type: web
    name: ask-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./platform/api
    dockerfilePath: ./platform/api/Dockerfile.railway
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:
      paths:
        - platform/api/**
    envVars:
      - key: ASK_ENV
        value: development
      - key: ASK_EMAIL_BACKEND
        value: console
      - key: ASK_COOKIE_SECURE
        value: "true"
      - key: ASK_WEB_ORIGINS
        value: https://ask-app-tau.vercel.app
      - key: ASK_WEB_BASE_URL
        value: https://ask-app-tau.vercel.app
      # Sign-in limits and the audit log record the caller's address. Without these two, every caller on this
      # service shares one address (Render's own) and so one rate-limit bucket: a few wrong passwords lock
      # sign-in for everyone. One hop is the safe value: it reads the LAST X-Forwarded-For entry, which only
      # the proxy right in front of this service writes, so a caller cannot choose it. What that entry holds
      # behind Vercel's rewrite was NOT observed: see docs/SECURITY.md ("Client address behind Vercel and
      # Render") for how to check it. Do not raise the hop count without that check: if it is too high, a
      # caller could pick their own address and walk around the sign-in limit.
      - key: ASK_TRUST_FORWARDED_FOR
        value: "true"
      - key: ASK_TRUSTED_PROXY_HOPS
        value: "1"
      - key: ASK_AI_PROVIDER
        value: google
      # The same values the Railway server used, so signed-in sessions and every provisioned locket keep working.
      - key: ASK_SECRET_KEY
        sync: false
      # Locket secrets are derived from this key: never change it once lockets are provisioned on this server.
      - key: ASK_LOCKET_MASTER_KEY
        sync: false
      # The Neon connection string (postgresql://...?sslmode=require).
      - key: ASK_DATABASE_URL
        sync: false
      - key: ASK_DELETE_AUDIO_AFTER_PROCESSING
        value: "true"
      - key: ASK_LOCKET_CODE_REQUESTS_PER_HOUR
        value: "30"
      - key: ASK_LOCKET_CODE_REQUESTS_PER_LOCKET_PER_HOUR
        value: "30"
      - key: ASK_WORKER_POLL_SECONDS
        value: "0.5"
      - key: ASK_GOOGLE_STT_API_KEY
        sync: false
      - key: ASK_GEMINI_API_KEY
        sync: false
